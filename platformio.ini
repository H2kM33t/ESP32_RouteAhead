; RouteAhead - ESP32-C3 + 1.8" ST7735 TFT
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, `pio run -t upload` builds and uploads EVERY env in this file and the
; board ends up running whichever came last - which is how the pin scanner kept
; overwriting the real firmware. Diagnostics must be asked for explicitly with -e.
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    h2zero/NimBLE-Arduino @ ^2.0.0

build_flags =
    ; ---- Serial over the C3's native USB ----
    ; Without this, Serial.print goes to the hardware UART pins and the USB monitor
    ; stays silent. This is the single most common "my C3 prints nothing" cause.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

    ; ---- Panel wiring: ESP32-C3 SuperMini -> 1.8" ST7735S ----
    ; Confirmed against the board, not guessed.
    ;   SCK  -> GPIO4      MOSI -> GPIO6      CS -> GPIO7
    ;   DC   -> GPIO2      RST  -> GPIO3      MISO -> GPIO5 (unused, 3-wire)
    ;   VCC  -> 3V3        GND  -> GND        BL  -> 3V3 (always on, no GPIO)
    ;
    ; TFT_BL is -1 because the backlight is hard-wired to 3V3. Earlier this was set to
    ; GPIO3 on a guess - which is the panel's RESET line, so the firmware was resetting
    ; the display while believing it was dimming it. That plus a wrong DC pin is what
    ; kept the panel dark.
    ;
    ; NOTE: this project used TFT_eSPI until it was found to crash on boot on the C3.
    ; TFT_eSPI defines SPI_PORT as SPI2_HOST (== 1), but this ESP-IDF's REG_SPI_BASE(i)
    ; only returns a real base when i == 2 and yields 0 otherwise - so its register
    ; pointers land at address 0x10 and the first draw store-faults. The define is
    ; unguarded, so it cannot be overridden from here. LovyanGFX handles the C3 properly.
    -D TFT_SCLK=4
    -D TFT_MOSI=6
    -D TFT_CS=7
    -D TFT_DC=2
    -D TFT_RST=3
    -D TFT_BL=-1

    ; 27 MHz is a safe ceiling for ST7735 on flying-lead wiring. Cut to 20000000 if you
    ; get sparkle or torn frames; raise to 40000000 only on a proper PCB.
    -D SPI_FREQUENCY=27000000

; Bring-up diagnostic: blinks the backlight, then cycles solid colours, so a blank
; panel can be narrowed to backlight vs control pins vs panel offsets in one flash.
;   pio run -e display-test -t upload
[env:display-test]
extends = env:esp32-c3-devkitm-1
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
    -D DISPLAY_TEST=1

; Wiring finder for an unknown board: cycles through plausible pin sets, painting a
; big number on screen for each. The number that appears identifies your wiring.
;   pio run -e pin-scan -t upload
[env:pin-scan]
extends = env:esp32-c3-devkitm-1
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
    -D PIN_SCAN=1

; Holds the pins fixed and sweeps bus/panel settings instead, strobing the screen for
; each. Use when you believe the wiring is right but the panel still shows nothing.
;   pio run -e panel-probe -t upload
[env:panel-probe]
extends = env:esp32-c3-devkitm-1
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
    -D PANEL_PROBE=1
